<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="description" content="An interactive study in color, form, and a little gravity. Move, blend, and play.">
  <title>FLOAT. — Interactive Color Study</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23e95732'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&amp;display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:wght,FILL@200..400,1&amp;icon_names=close,settings&amp;display=block">
  <link rel="stylesheet" href="scss/style.css?v=20261030-2">
  <script defer src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <header class="header">
    <h1 class="logo">FLOAT<span>.</span></h1>
    <p class="edition">COPYRIGHT ⓒ 2026 UNI</p>
  </header>
  <main class="playground" aria-label="Interactive geometric color playground">
    <div class="shapes blend-normal" aria-hidden="true"></div>
  </main>
  <button class="adjust" type="button" aria-label="Open controls" aria-expanded="false" aria-controls="settings"><span class="material-symbols-rounded" aria-hidden="true">settings</span></button>
  <div class="popup-backdrop" hidden aria-hidden="true"></div>
  <section class="settings-popup" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" aria-hidden="true" inert>
    <div class="heading"><h2 id="settings-title">PLAYGROUND SETTINGS</h2><button class="close" type="button" aria-label="Close controls"><span class="material-symbols-rounded" aria-hidden="true">close</span></button></div>
    <div class="controls">
      <div class="field type-range"><label for="size">SHAPE SIZE <output id="size-value" for="size">100%</output></label><input id="size" type="range" min="50" max="150" step="5" value="100"><div class="limits" aria-hidden="true"><span>50%</span><span>150%</span></div></div>
      <div class="field type-range"><label for="count">SHAPE COUNT <output id="count-value" for="count">15</output></label><input id="count" type="range" min="3" max="30" step="1" value="15"><div class="limits" aria-hidden="true"><span>3</span><span>30</span></div></div>
      <fieldset class="field" id="mode"><legend>INTERACTION</legend><div class="options" role="group" aria-label="INTERACTION"><button type="button" data-value="float" aria-pressed="false">Float</button>
<button type="button" data-value="repel" aria-pressed="true">Repel</button>
<button type="button" data-value="attract" aria-pressed="false">Attract</button>
<button type="button" data-value="scatter" aria-pressed="false">Scatter</button>
<button type="button" data-value="gravity" aria-pressed="false">Gravity</button>
<button type="button" data-value="bounce" aria-pressed="false">Bounce</button></div></fieldset>
      <fieldset class="field" id="blend"><legend>BLENDING</legend><div class="options" role="group" aria-label="BLENDING"><button type="button" data-value="normal" aria-pressed="true">Normal</button>
<button type="button" data-value="multiply" aria-pressed="false">Multiply</button>
<button type="button" data-value="screen" aria-pressed="false">Screen</button>
<button type="button" data-value="overlay" aria-pressed="false">Overlay</button>
<button type="button" data-value="darken" aria-pressed="false">Darken</button>
<button type="button" data-value="lighten" aria-pressed="false">Lighten</button>
<button type="button" data-value="color-dodge" aria-pressed="false">Color dodge</button>
<button type="button" data-value="color-burn" aria-pressed="false">Color burn</button>
<button type="button" data-value="hard-light" aria-pressed="false">Hard light</button>
<button type="button" data-value="soft-light" aria-pressed="false">Soft light</button>
<button type="button" data-value="difference" aria-pressed="false">Difference</button>
<button type="button" data-value="exclusion" aria-pressed="false">Exclusion</button>
<button type="button" data-value="hue" aria-pressed="false">Hue</button>
<button type="button" data-value="saturation" aria-pressed="false">Saturation</button>
<button type="button" data-value="color" aria-pressed="false">Color</button>
<button type="button" data-value="luminosity" aria-pressed="false">Luminosity</button>
<button type="button" data-value="plus-darker" aria-pressed="false">Plus darker</button>
<button type="button" data-value="plus-lighter" aria-pressed="false">Plus lighter</button></div></fieldset>
    </div>
  </section>
  <p class="status" role="status" hidden></p>
</body>
</html>
